name: multimodal-document-chat

description: |
  Simplified multimodal document chat application using Databricks Managed MCP.
  This app demonstrates document processing capabilities with table-based storage
  and direct foundation model integration.

compute:
  - name: default
    mode: "serverless"  # Use Databricks serverless for cost efficiency

env:
  # Databricks Connection Settings
  DATABRICKS_WAREHOUSE_ID: "your_warehouse_id_here"  # Replace with your SQL warehouse ID
  DATABRICKS_LLM_ENDPOINT: "databricks-meta-llama-3-1-405b-instruct"  # Foundation model endpoint
  
  # Table Configuration
  CATALOG: "main"
  SCHEMA: "default"
  DOCUMENTS_TABLE: "processed_documents"
  CHUNKS_TABLE: "document_chunks"
  
  # App Settings
  APP_TITLE: "Document Chat - Simplified"
  MAX_SEARCH_RESULTS: "5"
  DEFAULT_MAX_TOKENS: "1000"
  
  # Optional: Alternative foundation models you can use
  # DATABRICKS_LLM_ENDPOINT: "databricks-meta-llama-3-1-70b-instruct"
  # DATABRICKS_LLM_ENDPOINT: "databricks-mixtral-8x7b-instruct"

# Python dependencies
python:
  version: "3.11"
  
  # Keep dependencies minimal - no custom agent libraries needed
  requirements:
    - streamlit
    - databricks-sdk
    - databricks-langchain>=0.2.0
    - pandas
    - pillow

# Resources - minimal since we're using managed services
resources:
  cpu: "1"
  memory: "2Gi"

# Health check
health_check:
  endpoint: "/"
  initial_delay_seconds: 30
  timeout_seconds: 10

# Auto-scaling
auto_scaling:
  enabled: true
  min_replicas: 0  # Scale to zero when not in use
  max_replicas: 2
  
# Networking  
networking:
  ingress:
    - from: "internet"  # Allow public access for demo purposes

# Monitoring and observability
observability:
  logging:
    level: "INFO"
  metrics:
    enabled: true