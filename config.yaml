data:
  catalog: shm
  schema: multimodal
  raw_docs_vol: raw_docs
  processed_docs_vol: processed_docs
  chunks_table_name: chunks
  overwrite: True
model:
  endpoint_name: databricks-meta-llama-3-3-70b-instruct
  temperature: 0
  max_tokens: 400
retriever:
  endpoint_name: one-env-shared-endpoint-3
  index_name: index
  embedding_model: databricks-gte-large-en
  search_type: hybrid
  score_threshold: 0
  num_results: 5
  text_column: enriched_text
  document_uri: image_path
  primary_key: id
  additional_columns:
    - filename
    - input_hash
    - pages
    - chunk_type
  chunk_template: 'Passage: {chunk_text}\n Document URI: {document_uri}\n'
agent:
  streaming: False
  experiment_location: /Users/scott.mckean/agent_langgraph
  uc_model_name: shm.multimodal.agent_langgraph
interface:
  title: Multimodal Document Retrieval
  description: Search for documents and retrieve links and images of pages, tables, and figures.
  example: What is the factor of safety for fabric strapping?
  serving_endpoint: agents_shm-multimodal-agent_langgraph
