[project]
name = "multimodal-document-processing"
version = "2.0.0"
description = "Simplified docling notebook and serving workflows"
requires-python = ">=3.12"

dependencies = [
    "docling>=2.68.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "ipython>=8.0.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]
local = [
    "databricks-ai-bridge",
    "databricks-connect==17.2.3",
    "databricks-sdk==0.49.0",
    "databricks-vectorsearch>=0.30.0",
    "docling",
    "ipykernel>=6.0.0",
    "mlflow>=3.4.0",
    "onnxruntime",
    "pandas==2.2.3",
    "pillow==11.1.0",
    "pymssql==2.3.8",
    "requests==2.32.3",
]
serving = [
    "databricks-ai-bridge",
    "databricks-sdk==0.49.0",
    "docling",
    "mlflow>=3.4.0",
    "onnxruntime",
    "pandas==2.2.3",
    "pillow==11.1.0",
    "pymssql==2.3.8",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
]
markers = [
    "docling: Docling method tests", 
    "serving: Serving endpoint tests",
    "app: Streamlit app tests",
    "integration: Integration tests",
    "unit: Unit tests",
    "document: Document processing tests",
    "error_handling: Error handling tests",
    "data_validation: Data validation tests",
    "regression: Regression tests",
    "performance: Performance tests",
    "slow: Slow running tests",
]
# asyncio_mode = "auto"  # Disabled - not using async tests currently

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/venv/*",
    "*/.venv/*",
    "run_tests.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError", 
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true 