[project]
name = "multimodal-document-processing"
version = "2.0.0"
description = "Simplified docling-based or AI_PARSE_DOCUMENT multimodal processing"
requires-python = ">=3.12"

dependencies = [
    "docling"
]


# Development
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "ipython>=8.0.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
]
markers = [
    "aiparse: AI_PARSE method tests",
    "docling: Docling method tests", 
    "serving: Serving endpoint tests",
    "app: Streamlit app tests",
    "integration: Integration tests",
    "unit: Unit tests",
    "document: Document processing tests",
    "error_handling: Error handling tests",
    "data_validation: Data validation tests",
    "regression: Regression tests",
    "performance: Performance tests",
    "slow: Slow running tests",
]
# asyncio_mode = "auto"  # Disabled - not using async tests currently

[tool.coverage.run]
source = ["src", "."]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/venv/*",
    "*/.venv/*",
    "run_tests.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError", 
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true 